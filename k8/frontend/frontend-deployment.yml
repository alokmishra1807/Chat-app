apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-app-deployment
  namespace: chat-app-ns
  labels:
    app: chat-app-frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-app-frontend
  template:
    metadata:
      labels:
        app: chat-app-frontend
    spec:
      containers:
      - name: chat-app-frontend
        image: alokmishra773/chat-app-frontend:latest
        ports:
        - containerPort: 3001

              
