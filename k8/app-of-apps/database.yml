apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-child             # Child app name
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/alokmishra1807/Chat-app.git # repo in which apps are kept
    targetRevision: main
    path: k8/database # path of backend-app
  destination:
    server: https://172.16.0.4:33893 # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: chat-app-ns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


      