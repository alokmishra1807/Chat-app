apiVersion: v1
kind: Service
metadata:
 name: chat-frontend  #this is what we have provided in nginx.conf
 namespace: chat-app-ns

spec:
 selector:
  app: chat-app-frontend #here we have to write the label provided to the pod that are run by this service.
 
 ports:
   - protocol: TCP
     port: 3001 # cluster/servie ip address  
     targetPort: 80   # ip address of the container
